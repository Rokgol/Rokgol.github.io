<!DOCTYPE html>

<body>

<main class="page">

  <header class="intro">
    <!-- Profile picture: assets/photo.jpg -->

         onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'photo photo-empty',textContent:'YR'}))">
    <div>
      <h1>Yotam Ravid</h1>
      <p class="lede">Electrical engineering student at the Technion. I like turning ideas into models, and models into hardware.</p>
      <p class="links">
        <a href="assets/cv.pdf">CV (PDF)</a>
        <a href="https://github.com/Rokgol">GitHub</a>
        <a href="mailto:yotam.ravid@gmail.com">Email</a>
      </p>
    </div>
  </header>

  <section class="tank" aria-label="Live wave simulation">
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="tank-bar">
      <button type="button" id="fiber" aria-pressed="false">Add an optical fiber</button>
      <button type="button" id="tilt" hidden>Steer with your phone</button>
    </div>
    <p class="tank-note" id="tank-note"><i>∂²u/∂t² = (c/n)² ∇²u</i>, solved live. Drag, swipe or scroll to make waves.</p>
  </section>

  <nav class="board" aria-label="Projects and info">
    <div class="tiles">
      <button class="tile" data-open="car"><b>Closed-loop RC car</b><span>C, Pico 2 W</span><em>PI + feedforward speed control, driven over Wi-Fi</em></button>
      <button class="tile" data-open="remote"><b>Joystick remote</b><span>C, Pico 2 W</span><em>Joystick to UDP velocity commands, with e-stop</em></button>
      <button class="tile" data-open="snake"><b>Snake on an FPGA</b><span>SystemVerilog</span><em>Game logic, graphics and sound in hardware</em></button>
      <button class="tile" data-open="mirror"><b>Wi-Fi reflector</b><span>RF propagation</span><em>Dead-zone throughput from 5 to 200 Mbps</em></button>
      <button class="tile" data-open="map"><b>Historical Map Game</b><span>JavaScript, Leaflet</span><em>5,400 years of borders, guess the year</em></button>
      <button class="tile tile-info" data-open="courses"><b>Coursework</b><span>GPA 90.6</span><em>Now taking Photonics and Lasers, Waves and Distributed Systems, Physical Electronics and Electronic Circuits.<br><br>Already done: Signals and Systems, Electromagnetic Fields, Quantum Physics, PDEs.<br><br>Dean's Honor Roll, Spring 2025.</em></button>

<!-- One dialog, filled from the templates below -->
<dialog id="panel" aria-labelledby="panel-title">
  <button class="close" type="button" aria-label="Close">×</button>
  <div class="panel-body"></div>
</dialog>

<template id="t-car">
  <h2 id="panel-title">Remote-controlled car with closed-loop speed control</h2>
  <p class="meta">C, Raspberry Pi Pico 2 W, 2026</p>
  <div class="media">
    <video src="assets/car.mp4" poster="assets/car-poster.jpg" autoplay muted loop playsinline controls aria-label="The car driving around the living room, steered with the joystick remote"></video>
  </div>
  <p>Built on my own to put what I'd learnt at the Technion to use. I modelled the motors, designed a PI controller with feedforward that holds velocity from wheel-encoder feedback, and wrote the firmware in C.</p>
  <p>The Pico runs its own Wi-Fi access point and takes commands over UDP. A 10 kHz control loop reads encoder periods timed by the PIO at 2 µs resolution. The chassis has no steering rack, so it turns tank-style.</p>
  <p class="actions"><a href="https://github.com/Rokgol/MotorControl">Source on GitHub</a></p>
</template>

<template id="t-remote">
  <h2 id="panel-title">Joystick remote for the car</h2>
  <p class="meta">C, Raspberry Pi Pico 2 W, 2026</p>
  <div class="media">
    <img src="assets/remote.jpg" alt="Driving the car from the floor with the joystick remote">
  </div>
  <p>A second Pico 2 W reads an analog joystick, calibrates its center at boot, and streams velocity references to the car over UDP every 50 ms. Pressing the stick sends an emergency stop.</p>
  <p class="actions"><a href="https://github.com/Rokgol/MotorControl/blob/main/REMOTEREADME.md">Source on GitHub</a></p>
</template>

<template id="t-snake">
  <h2 id="panel-title">Snake on an FPGA</h2>
  <p class="meta">SystemVerilog, Quartus, Intel Cyclone V SoC, 2026</p>
  <div class="media">
    <iframe src="https://www.youtube-nocookie.com/embed/1UiXuW0C5MQ?rel=0" title="Snake on an FPGA, gameplay video" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>
  </div>
  <p>A retro Snake game built in hardware for EE Lab 1 with Orr. I designed the movement logic, graphics, sound and the game's state machine.</p>
  <p class="actions"><a href="https://github.com/Rokgol/YotamAndOrrsSnakeGame">Source on GitHub</a> <a href="https://youtu.be/1UiXuW0C5MQ">Watch on YouTube</a></p>
</template>

<template id="t-mirror">
  <h2 id="panel-title">The Mirror Project: a passive Wi-Fi reflector</h2>
  <p class="meta">RF propagation, 2026</p>
  <p>A foil-lined reflector box that bends a router's signal around metal doors and the reinforced concrete of a safe room. Throughput in the dead zone went from 5 to 200 Mbps at almost no cost, where commercial repeaters had failed.</p>
</template>

<template id="t-map">
  <h2 id="panel-title">Historical Map Game</h2>
  <p class="meta">JavaScript, Leaflet</p>
  <p>Political borders across 5,400 years, from 3400 BCE to today, on an interactive map. In game mode you see a random year's borders and guess the year. Older years allow bigger misses. Built on the Seshat Cliopatria dataset.</p>
  <p class="actions"><a href="https://rokgol.github.io/HistoricalMapGame/">Play it</a> <a href="https://github.com/Rokgol/HistoricalMapGame">Source on GitHub</a></p>
</template>

<template id="t-courses">
  <h2 id="panel-title">Coursework</h2>
  <p class="meta">GPA 90.6. Dean's Honor Roll, Spring 2025. Expected graduation 2028.</p>
  <ol class="semesters">
    <li class="now"><h3>Winter 2026–27 <span>now</span></h3><p>Photonics and Lasers, Waves and Distributed Systems, Physical Electronics, Electronic Circuits, Modular Robotics, EE Lab 1B</p></li>
    <li><h3>Spring 2026</h3><p>Signals and Systems, Electromagnetic Fields, Semiconductor Devices, Probability, EE Lab 1A</p></li>
    <li><h3>Winter 2025–26</h3><p>Quantum Physics for Engineers, Partial Differential Equations, Complex Functions, Fourier Series and Integral Transforms, Electric Circuit Theory, Data Structures and Algorithms</p></li>
    <li><h3>Spring 2025</h3><p>Digital Systems and Computer Structure, Physics 2, Calculus 2, Algebra 2, Ordinary Differential Equations</p></li>
    <li><h3>Winter 2024–25</h3><p>Physics 1, Physics Lab 1, Calculus 1, Algebra 1, Intro to Computer Science</p></li>
  </ol>
</template>


<script src="field.js"></script>
<script>
  // Tiles open the dialog with the matching template
  const panel = document.getElementById("panel");
  const body = panel.querySelector(".panel-body");
  let opener = null;
  document.querySelectorAll("[data-open]").forEach(btn => btn.addEventListener("click", () => {
    opener = btn;
    body.replaceChildren(document.getElementById("t-" + btn.dataset.open).content.cloneNode(true));
    panel.showModal();
    body.scrollTop = 0;
  }));
  panel.querySelector(".close").addEventListener("click", () => panel.close());
  panel.addEventListener("click", e => { if (e.target === panel) panel.close(); }); // click outside the box
  panel.addEventListener("close", () => { body.replaceChildren(); opener && opener.focus(); }); // also stops any video
</script>
</body>
</html>
